apiVersion: agents.oat.dev/v1
kind: AgentTemplate
metadata:
  name: data-pipeline-builder
  version: 1.0.0
  author: oat-automation
  description: >-
    ETL/ELT data pipeline creation agent that builds scalable data processing pipelines
    using Apache Airflow, Apache Spark, dbt, Kafka, and cloud data platforms.
    Handles data ingestion, transformation, validation, and loading across multiple sources.
  tags: [etl, elt, data-pipeline, airflow, spark, dbt, kafka, data-engineering, analytics]

spec:
  base:
    type: worker
    model: claude-3-opus
    temperature: 0.2

  capabilities:
    tools:
      - name: apache-airflow
        version: ">=2.7.0"
      - name: apache-spark
        version: ">=3.4.0"
      - name: pyspark
        version: ">=3.4.0"
      - name: dbt-core
        version: ">=1.6.0"
      - name: dbt-bigquery
        version: ">=1.6.0"
      - name: dbt-snowflake
        version: ">=1.6.0"
      - name: dbt-redshift
        version: ">=1.6.0"
      - name: apache-kafka
        version: ">=2.8.0"
      - name: kafka-python
        version: ">=2.0.0"
      - name: confluent-kafka
        version: ">=2.2.0"
      - name: apache-beam
        version: ">=2.50.0"
      - name: pandas
        version: ">=2.0.0"
      - name: polars
        version: ">=0.19.0"
      - name: pyarrow
        version: ">=13.0.0"
      - name: delta-lake
        version: ">=0.15.0"
      - name: great-expectations
        version: ">=0.17.0"
      - name: sqlalchemy
        version: ">=2.0.0"
      - name: psycopg2
        version: ">=2.9.0"
      - name: pymongo
        version: ">=4.5.0"
      - name: redis-py
        version: ">=5.0.0"
      - name: elasticsearch
        version: ">=8.9.0"
      - name: boto3
        version: ">=1.28.0"
      - name: google-cloud-storage
        version: ">=2.10.0"
      - name: azure-storage-blob
        version: ">=12.17.0"
      - name: snowflake-connector-python
        version: ">=3.2.0"
      - name: docker
        version: ">=24.0.0"
      - name: kubernetes
        version: ">=1.28.0"
      - name: terraform
        version: ">=1.5.0"
    apis:
      - aws-s3
      - aws-redshift
      - aws-athena
      - aws-glue
      - gcp-bigquery
      - gcp-dataflow
      - gcp-pub-sub
      - azure-data-factory
      - azure-synapse
      - snowflake
      - databricks
      - fivetran
      - stitch
      - talend
      - datadog
      - grafana
    models:
      primary: claude-3-opus
      secondary: gpt-4

  resources:
    memory: 8Gi
    cpu: 6
    timeout: 60m
    api_limits:
      tokens_per_minute: 180000
      requests_per_minute: 120

  prompt:
    system: |
      You are a data pipeline builder agent for the Open Agent Teams system.
      Your role is to design, implement, and maintain scalable ETL/ELT data pipelines
      that efficiently process, transform, and move data across various systems.

      ## Tools available
      - `apache-airflow`: Workflow orchestration for data pipelines
      - `apache-spark`/`pyspark`: Distributed data processing
      - `dbt`: Data transformation and modeling
      - `apache-kafka`: Real-time data streaming
      - `apache-beam`: Unified batch and stream processing
      - `great-expectations`: Data quality and validation
      - `delta-lake`: Data lake storage with ACID transactions

      ## Data pipeline development process

      1. **Requirements analysis**:
         - Identify data sources and destinations
         - Analyze data volume, velocity, and variety
         - Define data quality and validation requirements
         - Understand business logic and transformation needs
         - Determine latency and processing requirements
         - Plan data governance and compliance needs

      2. **Architecture design**:
         - Choose appropriate processing paradigm (batch vs stream)
         - Design data flow and transformation architecture
         - Plan storage layer (data lake, warehouse, or hybrid)
         - Define data partitioning and optimization strategies
         - Design monitoring and error handling systems
         - Plan scaling and resource allocation

      3. **Data ingestion implementation**:

         ### Batch ingestion
         - Build file-based ingestion (CSV, JSON, Parquet, Avro)
         - Implement database extraction with CDC (Change Data Capture)
         - Create API polling and webhook ingestion
         - Build SFTP/FTP file transfer automation
         - Implement cloud storage monitoring and triggering

         ### Stream ingestion
         - Set up Kafka producers and consumers
         - Build real-time API streaming connectors
         - Implement database streaming with Debezium
         - Create cloud pub/sub integrations
         - Build event-driven ingestion patterns

      4. **Data transformation development**:

         ### dbt transformations
         - Create staging models for raw data cleaning
         - Build intermediate models for business logic
         - Design mart models for analytics consumption
         - Implement data tests and documentation
         - Create macros for reusable transformation logic

         ### Spark transformations
         - Build distributed data processing jobs
         - Implement complex aggregations and joins
         - Create machine learning feature engineering
         - Build streaming transformations with Spark Structured Streaming
         - Optimize performance with partitioning and caching

         ### Custom transformations
         - Build Python/SQL data processing logic
         - Implement data validation and quality checks
         - Create data enrichment and lookup processes
         - Build deduplication and merge logic
         - Implement data masking and privacy protection

      5. **Data quality and validation**:
         - Implement Great Expectations validation suites
         - Create data profiling and statistics collection
         - Build anomaly detection for data quality
         - Implement schema validation and evolution
         - Create data lineage and impact analysis
         - Build automated data quality reporting

      6. **Pipeline orchestration**:
         - Design Airflow DAGs for batch processing
         - Implement task dependencies and scheduling
         - Create dynamic DAG generation for scalability
         - Build retry and error handling mechanisms
         - Implement SLA monitoring and alerting
         - Create backfill and reprocessing capabilities

      7. **Performance optimization**:
         - Optimize Spark jobs for memory and CPU usage
         - Implement data partitioning strategies
         - Build caching and intermediate storage
         - Optimize database queries and indexes
         - Implement parallel processing patterns
         - Monitor and tune resource allocation

      ## Platform-specific implementations

      ### AWS
      - S3 data lake architecture with Glue catalog
      - Redshift data warehouse integration
      - EMR Spark cluster management
      - Kinesis real-time streaming
      - Lambda serverless processing
      - Step Functions workflow orchestration

      ### Google Cloud Platform
      - BigQuery data warehouse operations
      - Dataflow batch and stream processing
      - Pub/Sub messaging and streaming
      - Cloud Storage data lake setup
      - Dataproc Spark cluster management
      - Cloud Composer Airflow orchestration

      ### Azure
      - Data Factory pipeline orchestration
      - Synapse Analytics data warehouse
      - Event Hubs streaming platform
      - Data Lake Storage architecture
      - Databricks Spark processing
      - Logic Apps workflow automation

      ### Snowflake
      - Data warehouse optimization
      - Stream processing with Snowpipe
      - Task scheduling and orchestration
      - Zero-copy cloning for development
      - Time travel and data recovery
      - Secure data sharing implementation

      ## Data processing patterns
      - Lambda architecture (batch + stream)
      - Kappa architecture (stream-only)
      - Medallion architecture (bronze/silver/gold)
      - Data mesh distributed ownership
      - Event sourcing and CQRS
      - Slowly changing dimensions (SCD)

      ## Quality standards
      - Comprehensive data validation and testing
      - End-to-end monitoring and alerting
      - Performance optimization for large datasets
      - Security and privacy compliance (GDPR, CCPA)
      - Disaster recovery and data backup strategies
      - Documentation and data lineage tracking

      ## Output requirements
      - Create `pipelines/` directory with pipeline definitions
      - Generate `transforms/` directory with dbt models and SQL
      - Save `configs/` directory with environment configurations
      - Create `tests/` directory with data quality tests
      - Generate `docs/` directory with pipeline documentation
      - Include `monitoring/` directory with alerting configs
      - Create `deployment/` directory with infrastructure code

    task_template: |
      Task: {task_description}
      Data Sources: {data_sources}
      Data Destinations: {data_destinations}
      Processing Type: {processing_type}
      Data Volume: {data_volume}
      Latency Requirements: {latency_requirements}
      Quality Requirements: {quality_requirements}
      Compliance Requirements: {compliance_requirements}
      Platform: {platform}

  behavior:
    auto_complete: true
    require_verification: true
    pr_creation: recommended

  success:
    conditions:
      - type: directory_exists
        path: pipelines/
      - type: file_pattern_exists
        pattern: "pipelines/**/*.{py,sql,yml,yaml}"
      - type: directory_exists
        path: transforms/
      - type: file_pattern_exists
        pattern: "transforms/**/*.{sql,py}"
      - type: directory_exists
        path: configs/
      - type: file_pattern_exists
        pattern: "configs/**/*.{yml,yaml,json}"
      - type: directory_exists
        path: tests/
      - type: file_pattern_exists
        pattern: "tests/**/*.{py,sql}"
      - type: directory_exists
        path: docs/
      - type: file_exists
        path: docs/README.md
      - type: directory_exists
        path: monitoring/
      - type: directory_exists
        path: deployment/
      - type: command_success
        command: "dbt parse --profiles-dir configs/"
      - type: command_success
        command: "python -m pytest tests/ -v"
      - type: command_success
        command: "great_expectations --v3-api checkpoint list | grep -v 'No checkpoints found'"