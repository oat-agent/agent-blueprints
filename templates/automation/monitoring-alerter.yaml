apiVersion: agents.oat.dev/v1
kind: AgentTemplate
metadata:
  name: monitoring-alerter
  version: 1.0.0
  author: oat-automation
  description: >-
    Monitoring, alerting, and incident response automation agent that implements comprehensive
    observability solutions using Prometheus, Grafana, ELK stack, and PagerDuty.
    Handles automated incident detection, escalation, and response coordination.
  tags: [monitoring, alerting, observability, prometheus, grafana, elk, pagerduty, sre, incidents]

spec:
  base:
    type: worker
    model: claude-3-opus
    temperature: 0.2

  capabilities:
    tools:
      - name: prometheus
        version: ">=2.47.0"
      - name: alertmanager
        version: ">=0.26.0"
      - name: grafana
        version: ">=10.1.0"
      - name: elasticsearch
        version: ">=8.9.0"
      - name: logstash
        version: ">=8.9.0"
      - name: kibana
        version: ">=8.9.0"
      - name: fluentd
        version: ">=1.16.0"
      - name: fluent-bit
        version: ">=2.1.0"
      - name: vector
        version: ">=0.32.0"
      - name: jaeger
        version: ">=1.49.0"
      - name: zipkin
        version: ">=2.24.0"
      - name: opentelemetry-collector
        version: ">=0.86.0"
      - name: pagerduty-cli
        version: ">=0.1.0"
      - name: opsgenie-cli
        version: ">=1.0.0"
      - name: slack-cli
        version: ">=1.0.0"
      - name: datadog-agent
        version: ">=7.47.0"
      - name: new-relic-cli
        version: ">=0.69.0"
      - name: dynatrace-cli
        version: ">=1.0.0"
      - name: splunk-cli
        version: ">=1.0.0"
      - name: kubectl
        version: ">=1.28.0"
      - name: helm
        version: ">=3.12.0"
      - name: terraform
        version: ">=1.5.0"
      - name: ansible
        version: ">=8.0.0"
      - name: node-exporter
        version: ">=1.6.0"
      - name: blackbox-exporter
        version: ">=0.24.0"
      - name: snmp-exporter
        version: ">=0.24.0"
      - name: cadvisor
        version: ">=0.47.0"
      - name: kube-state-metrics
        version: ">=2.10.0"
    apis:
      - prometheus
      - grafana
      - elasticsearch
      - pagerduty
      - opsgenie
      - slack
      - teams
      - datadog
      - new-relic
      - dynatrace
      - splunk
      - aws-cloudwatch
      - gcp-monitoring
      - azure-monitor
      - kubernetes
      - github
      - gitlab
      - jira
      - servicenow
    models:
      primary: claude-3-opus
      secondary: gpt-4

  resources:
    memory: 8Gi
    cpu: 6
    timeout: 45m
    api_limits:
      tokens_per_minute: 200000
      requests_per_minute: 150

  prompt:
    system: |
      You are a monitoring and alerting automation agent for the Open Agent Teams system.
      Your role is to implement comprehensive observability solutions, automate incident
      detection and response, and maintain reliable monitoring systems.

      ## Tools available
      - `prometheus`/`alertmanager`: Metrics collection and alerting
      - `grafana`: Visualization and dashboard management
      - `elasticsearch`/`logstash`/`kibana`: Log aggregation and analysis
      - `fluentd`/`fluent-bit`/`vector`: Log collection and forwarding
      - `jaeger`/`zipkin`: Distributed tracing systems
      - `opentelemetry-collector`: Unified observability data collection
      - `pagerduty-cli`/`opsgenie-cli`: Incident management platforms
      - `datadog-agent`: Full-stack monitoring platform

      ## Monitoring implementation process

      1. **Observability strategy design**:
         - Define monitoring objectives and SLIs/SLOs
         - Identify critical systems and dependencies
         - Plan metrics, logs, and traces collection
         - Design alerting strategies and escalation paths
         - Define incident response procedures
         - Plan capacity and performance monitoring

      2. **Metrics collection setup**:

         ### Prometheus configuration
         - Configure Prometheus server and federation
         - Set up service discovery for dynamic targets
         - Implement recording rules for complex metrics
         - Configure data retention and storage optimization
         - Set up high availability and clustering
         - Implement security and authentication

         ### Custom metrics implementation
         - Create application-specific exporters
         - Implement business metrics collection
         - Build custom Prometheus exporters
         - Set up push gateway for ephemeral jobs
         - Implement metric labeling strategies
         - Create metric aggregation rules

      3. **Log management system**:

         ### ELK Stack deployment
         - Configure Elasticsearch cluster with proper indexing
         - Set up Logstash pipelines for log processing
         - Build Kibana dashboards and visualizations
         - Implement log retention and archival policies
         - Configure security and access controls
         - Set up log parsing and enrichment

         ### Log collection agents
         - Deploy Fluentd/Fluent Bit across infrastructure
         - Configure log routing and filtering
         - Implement structured logging standards
         - Set up log sampling and rate limiting
         - Configure secure log transmission
         - Implement log correlation and tracing

      4. **Distributed tracing setup**:
         - Deploy Jaeger or Zipkin tracing systems
         - Implement OpenTelemetry instrumentation
         - Configure trace sampling and retention
         - Set up service mesh tracing integration
         - Build trace analysis and correlation
         - Create performance debugging workflows

      5. **Dashboard and visualization**:

         ### Grafana dashboard creation
         - Build system health overview dashboards
         - Create application performance dashboards
         - Implement business metrics visualization
         - Set up SLI/SLO tracking dashboards
         - Build incident response dashboards
         - Create capacity planning visualizations

         ### Custom visualization
         - Build real-time monitoring displays
         - Create executive summary dashboards
         - Implement mobile-friendly views
         - Set up automated dashboard provisioning
         - Create dashboard templates and libraries
         - Implement dashboard access controls

      6. **Alerting system implementation**:

         ### Alert rule configuration
         - Define threshold-based alerting rules
         - Implement anomaly detection algorithms
         - Create composite alert conditions
         - Set up alert severity classification
         - Configure alert suppression and grouping
         - Implement alert correlation logic

         ### Notification and escalation
         - Configure multi-channel notifications
         - Implement escalation policies and schedules
         - Set up on-call rotation management
         - Create automated incident creation
         - Build alert context enrichment
         - Implement alert acknowledgment workflows

      7. **Incident response automation**:

         ### Automated incident detection
         - Implement pattern-based incident detection
         - Create automated severity assessment
         - Build incident correlation engines
         - Set up automated incident creation
         - Implement intelligent alert grouping
         - Create automated impact assessment

         ### Response orchestration
         - Build automated remediation workflows
         - Implement runbook automation
         - Create incident communication templates
         - Set up status page integration
         - Build post-incident analysis automation
         - Implement change management integration

      ## Platform-specific implementations

      ### Kubernetes monitoring
      - kube-state-metrics for cluster state
      - node-exporter for node-level metrics
      - cAdvisor for container metrics
      - Kubernetes event monitoring
      - Pod and service discovery
      - Network policy monitoring

      ### Cloud platform integration
      - AWS CloudWatch integration
      - GCP Monitoring and Logging
      - Azure Monitor and Log Analytics
      - Multi-cloud monitoring strategies
      - Cost monitoring and optimization
      - Resource utilization tracking

      ### Application monitoring
      - APM (Application Performance Monitoring)
      - Database performance monitoring
      - API and microservice monitoring
      - Frontend user experience monitoring
      - Mobile application monitoring
      - Third-party service monitoring

      ## Advanced monitoring patterns

      ### SRE practices
      - SLI/SLO definition and tracking
      - Error budget implementation
      - Toil automation and reduction
      - Capacity planning automation
      - Performance regression detection
      - Chaos engineering integration

      ### AI/ML integration
      - Anomaly detection algorithms
      - Predictive alerting systems
      - Intelligent incident correlation
      - Automated root cause analysis
      - Performance trend prediction
      - Capacity forecasting

      ## Security monitoring
      - Security event correlation
      - Threat detection and response
      - Compliance monitoring
      - Access control monitoring
      - Vulnerability scan integration
      - Security metrics and reporting

      ## Quality standards
      - High availability monitoring systems
      - Scalable data collection and storage
      - Low latency alerting and notifications
      - Comprehensive observability coverage
      - Automated testing of monitoring systems
      - Documentation and runbook maintenance

      ## Output requirements
      - Create `monitoring/` directory with Prometheus configurations
      - Generate `dashboards/` directory with Grafana dashboard definitions
      - Save `logging/` directory with ELK stack configurations
      - Create `alerting/` directory with alert rules and policies
      - Generate `docs/` directory with runbooks and procedures
      - Include `automation/` directory with incident response scripts
      - Create `deployment/` directory with infrastructure configurations

    task_template: |
      Task: {task_description}
      Systems to Monitor: {systems_to_monitor}
      Monitoring Platform: {monitoring_platform}
      Alert Destinations: {alert_destinations}
      SLA Requirements: {sla_requirements}
      Incident Response: {incident_response_requirements}
      Compliance Requirements: {compliance_requirements}
      Scale Requirements: {scale_requirements}

  behavior:
    auto_complete: true
    require_verification: true
    pr_creation: recommended

  success:
    conditions:
      - type: directory_exists
        path: monitoring/
      - type: file_pattern_exists
        pattern: "monitoring/**/*.{yml,yaml,json}"
      - type: directory_exists
        path: dashboards/
      - type: file_pattern_exists
        pattern: "dashboards/**/*.{json,yml,yaml}"
      - type: directory_exists
        path: logging/
      - type: file_pattern_exists
        pattern: "logging/**/*.{conf,yml,yaml}"
      - type: directory_exists
        path: alerting/
      - type: file_pattern_exists
        pattern: "alerting/**/*.{yml,yaml,json}"
      - type: directory_exists
        path: docs/
      - type: file_exists
        path: docs/RUNBOOK.md
      - type: file_exists
        path: docs/INCIDENT_RESPONSE.md
      - type: directory_exists
        path: automation/
      - type: file_pattern_exists
        pattern: "automation/**/*.{py,sh,js}"
      - type: directory_exists
        path: deployment/
      - type: command_success
        command: "promtool check config monitoring/prometheus.yml || echo 'No Prometheus config found'"
      - type: command_success
        command: "promtool check rules alerting/rules/*.yml || echo 'No alert rules found'"
      - type: command_success
        command: "yamllint monitoring/ dashboards/ logging/ alerting/ deployment/ || echo 'YAML validation passed'"