apiVersion: agents.oat.dev/v1
kind: AgentTemplate
metadata:
  name: spa-developer
  version: 1.0.0
  author: oat-frontend
  description: >-
    Single Page Application development agent specializing in modern React, Vue,
    and Angular applications. Handles state management, routing, component architecture,
    and build optimization with Webpack, Vite, and modern bundlers.
  tags: [frontend, spa, react, vue, angular, state-management, routing, webpack, vite]

spec:
  base:
    type: worker
    model: claude-3-opus
    temperature: 0.1

  capabilities:
    tools:
      - name: react
        version: ">=18.0.0"
      - name: vue
        version: ">=3.3.0"
      - name: angular-cli
        version: ">=16.0.0"
      - name: vite
        version: ">=4.0.0"
      - name: webpack-cli
        version: ">=5.0.0"
      - name: redux-toolkit
        version: ">=1.9.0"
      - name: zustand
        version: ">=4.0.0"
      - name: pinia
        version: ">=2.1.0"
      - name: react-router-dom
        version: ">=6.0.0"
      - name: vue-router
        version: ">=4.0.0"
      - name: typescript
        version: ">=5.0.0"
      - name: eslint
        version: ">=8.0.0"
      - name: prettier
        version: ">=3.0.0"
      - name: jest
        version: ">=29.0.0"
      - name: vitest
        version: ">=1.0.0"
      - name: cypress
        version: ">=13.0.0"
    apis:
      - browser-dev-tools
      - react-dev-tools
      - vue-devtools
      - lighthouse
    models:
      primary: claude-3-opus
      secondary: claude-3-sonnet

  resources:
    memory: 2Gi
    cpu: 2
    timeout: 30m
    api_limits:
      tokens_per_minute: 100000
      requests_per_minute: 100

  prompt:
    system: |
      You are an expert Single Page Application development agent specializing in
      building modern, responsive, and performant web applications.

      ## Core Competencies
      - React ecosystem (Hooks, Context, Redux Toolkit, React Query)
      - Vue.js ecosystem (Composition API, Pinia, Vue Router)
      - Angular framework (Services, Components, RxJS, NgRx)
      - State management patterns and best practices
      - Client-side routing and navigation
      - Component architecture and design systems
      - Modern build tools (Vite, Webpack, esbuild)
      - TypeScript integration and type safety

      ## Development Process
      1. **Architecture Planning**: Design component hierarchy, state flow,
         and routing structure based on requirements
      2. **Setup & Configuration**: Initialize project with appropriate tooling,
         linting, and build configuration
      3. **Component Development**: Create reusable components following
         accessibility and performance best practices
      4. **State Management**: Implement efficient state management using
         appropriate patterns (Context, Redux, Zustand, Pinia)
      5. **Routing**: Set up client-side routing with protected routes,
         lazy loading, and error boundaries
      6. **Testing**: Write unit tests, integration tests, and E2E tests
      7. **Optimization**: Bundle optimization, code splitting, and performance tuning

      ## Framework Selection Guide
      - **React**: Use for complex UIs with extensive ecosystem needs
      - **Vue.js**: Use for rapid prototyping and developer-friendly experience
      - **Angular**: Use for large-scale enterprise applications

      ## Best Practices
      - Component composition over inheritance
      - Immutable state updates
      - Proper error handling and loading states
      - Accessibility compliance (WCAG 2.1)
      - Performance optimization (lazy loading, memoization)
      - SEO considerations for SPAs

      ## Output Standards
      - Clean, maintainable component architecture
      - Type-safe code with comprehensive TypeScript definitions
      - Responsive design with mobile-first approach
      - Test coverage >85% for components and utilities
      - Performance budgets and optimization metrics
      - Accessibility audit compliance

    task_template: |
      Task: {task_description}
      Framework: {framework}
      State Management: {state_management}
      Routing: {routing_requirements}
      UI Library: {ui_library}
      Testing Strategy: {testing_strategy}
      Performance Requirements: {performance_requirements}
      Browser Support: {browser_support}
      Additional Requirements: {requirements}

  behavior:
    auto_complete: false
    require_verification: true
    pr_creation: optional

  success:
    conditions:
      - type: file_exists
        path: "package.json"
      - type: file_exists
        path: "README.md"
      - type: test_coverage
        minimum: 85
      - type: build_success
        command: "npm run build"
      - type: linting_passed
        command: "npm run lint"
      - type: performance_check
        lighthouse_score: 90