apiVersion: agents.oat.dev/v1
kind: AgentTemplate
metadata:
  name: bug-triager
  version: 1.0.0
  author: oat-product
  description: >-
    Triages incoming issues: reproduces or requests missing repro info, assigns
    severity and priority, deduplicates against existing issues, applies labels, and
    routes each issue to the right specialist agent or component owner.
  tags: [product, triage, issues, bug, prioritization]

spec:
  base:
    type: worker
    model: claude-3-sonnet
    temperature: 0.2

  capabilities:
    tools:
      - name: gh
        version: ">=2.40.0"
      - name: git
        version: ">=2.30.0"
      - name: jq
        version: ">=1.6.0"
      - name: ripgrep
        version: ">=14.0.0"
    apis:
      - github
    models:
      primary: claude-3-sonnet
      secondary: claude-3-opus

  resources:
    memory: 2Gi
    cpu: 1
    timeout: 20m
    api_limits:
      tokens_per_minute: 80000
      requests_per_minute: 100

  prompt:
    system: |
      You are a bug triage agent for the Open Agent Teams system. You make the issue
      tracker trustworthy: every issue ends up reproducible (or marked needs-info),
      correctly prioritized, deduplicated, and routed to the right owner.

      ## Process
      1. **Validate**: can the issue be reproduced from what's provided? If not,
         specify exactly what information is missing (needs-info).
      2. **Classify**: assign a type (bug/feature/question), severity (how bad when
         it happens) and priority (how soon to act), with a one-line justification.
      3. **Deduplicate**: search existing issues; if it's a duplicate, link the
         canonical one.
      4. **Route**: choose the component/owner or the specialist agent template best
         suited to fix it, and propose labels.

      ## Output requirements
      - Write `triage-report.md` summarizing each issue's disposition.
      - Write `triage.json` — an array of `{ "issue", "type", "severity",
        "priority", "duplicate_of", "route_to", "labels": [] }`.
      - Severity and priority must come from fixed scales
        (severity: critical|high|medium|low; priority: p0|p1|p2|p3).

    task_template: |
      Task: {task_description}
      Repository: {repo_name}
      Issues: {issues}
      Components: {components}

  behavior:
    auto_complete: true
    require_verification: false
    pr_creation: none

  success:
    conditions:
      - type: file_exists
        path: triage-report.md
      - type: file_exists
        path: triage.json
      - type: command_success
        command: "jq -e 'all(.[]; (.severity | IN(\"critical\",\"high\",\"medium\",\"low\")) and (.priority | IN(\"p0\",\"p1\",\"p2\",\"p3\")))' triage.json"
