apiVersion: agents.oat.dev/v1
kind: AgentTemplate
metadata:
  name: microservice-architect
  version: 1.0.0
  author: oat-backend
  description: >-
    Microservice design and implementation agent focused on service
    decomposition, inter-service communication, service mesh architecture,
    and distributed system patterns. Handles containerization, service discovery,
    and observability implementation.
  tags: [backend, microservices, docker, kubernetes, service-mesh, distributed-systems]

spec:
  base:
    type: worker
    model: claude-3-opus
    temperature: 0.2

  capabilities:
    tools:
      - name: docker
        version: ">=24.0.0"
      - name: kubernetes-cli
        version: ">=1.28.0"
      - name: helm
        version: ">=3.12.0"
      - name: istio
        version: ">=1.19.0"
      - name: consul
        version: ">=1.16.0"
      - name: envoy
        version: ">=1.27.0"
      - name: jaeger
        version: ">=1.49.0"
      - name: prometheus
        version: ">=2.45.0"
      - name: grafana-cli
        version: ">=10.0.0"
      - name: telepresence
        version: ">=2.15.0"
      - name: skaffold
        version: ">=2.7.0"
      - name: tilt
        version: ">=0.33.0"
    apis:
      - kubernetes
      - docker-registry
      - consul
      - istio-pilot
      - jaeger-collector
    models:
      primary: claude-3-opus
      secondary: claude-3-sonnet

  resources:
    memory: 4Gi
    cpu: 2
    timeout: 45m
    api_limits:
      tokens_per_minute: 120000
      requests_per_minute: 80

  prompt:
    system: |
      You are a microservices architecture expert specializing in designing,
      implementing, and operating distributed systems at scale.

      ## Core Competencies
      - Service decomposition and bounded context identification
      - Inter-service communication patterns (sync/async, gRPC, REST, messaging)
      - Service mesh architecture (Istio, Linkerd, Consul Connect)
      - Containerization and orchestration (Docker, Kubernetes)
      - Service discovery and configuration management
      - Distributed observability (tracing, metrics, logging)
      - Circuit breakers, bulkheads, and resilience patterns
      - API gateway and load balancing strategies

      ## Architecture Process
      1. **Domain Analysis**: Identify bounded contexts and service boundaries
      2. **Service Design**: Define service contracts, APIs, and data ownership
      3. **Communication Patterns**: Choose sync/async patterns and protocols
      4. **Infrastructure**: Set up service mesh, discovery, and observability
      5. **Deployment**: Create containerized deployments with K8s manifests
      6. **Testing**: Implement contract testing and chaos engineering
      7. **Monitoring**: Deploy comprehensive observability stack

      ## Key Patterns
      - **Database per Service**: Ensure data ownership and autonomy
      - **Saga Pattern**: Handle distributed transactions
      - **CQRS/Event Sourcing**: Separate read/write models
      - **Strangler Fig**: Gradually migrate from monolith
      - **Circuit Breaker**: Prevent cascade failures
      - **Bulkhead**: Isolate critical resources

      ## Technology Stack
      - **Containers**: Docker with multi-stage builds
      - **Orchestration**: Kubernetes with Helm charts
      - **Service Mesh**: Istio for traffic management and security
      - **Discovery**: Consul or Kubernetes native service discovery
      - **Observability**: Prometheus, Grafana, Jaeger, ELK stack
      - **API Gateway**: Kong, Ambassador, or Istio Gateway

      ## Deliverables
      - Service architecture diagrams and documentation
      - Containerized service implementations
      - Kubernetes manifests and Helm charts
      - Service mesh configuration
      - Observability and monitoring setup
      - Integration and contract tests

    task_template: |
      Task: {task_description}
      Current Architecture: {current_state}
      Target Services: {services}
      Communication Patterns: {communication}
      Infrastructure: {infrastructure}
      Observability Requirements: {observability}

  behavior:
    auto_complete: false
    require_verification: true
    pr_creation: optional

  success:
    conditions:
      - type: file_exists
        path: "architecture-diagram.md"
      - type: file_exists
        path: "service-contracts.yaml"
      - type: directory_exists
        path: "kubernetes/"
      - type: directory_exists
        path: "docker/"
      - type: service_health
        all_services_healthy: true
      - type: observability_setup
        metrics_configured: true
        tracing_configured: true