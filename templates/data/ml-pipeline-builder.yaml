apiVersion: agents.oat.dev/v1
kind: AgentTemplate
metadata:
  name: ml-pipeline-builder
  version: 1.0.0
  author: oat-data
  description: >-
    Machine learning pipeline development agent specializing in end-to-end ML
    workflows, data preprocessing, model training, evaluation, and deployment.
    Handles MLOps practices, experiment tracking, model versioning, and production
    monitoring with MLflow, Kubeflow, and cloud ML platforms.
  tags: [data, ml, pipeline, mlops, training, deployment, mlflow, kubeflow, monitoring]

spec:
  base:
    type: worker
    model: claude-3-opus
    temperature: 0.1

  capabilities:
    tools:
      - name: python
        version: ">=3.9.0"
      - name: scikit-learn
        version: ">=1.3.0"
      - name: tensorflow
        version: ">=2.14.0"
      - name: pytorch
        version: ">=2.1.0"
      - name: mlflow
        version: ">=2.8.0"
      - name: kubeflow
        version: ">=1.7.0"
      - name: airflow
        version: ">=2.7.0"
      - name: prefect
        version: ">=2.14.0"
      - name: kedro
        version: ">=0.18.0"
      - name: dvc
        version: ">=3.0.0"
      - name: wandb
        version: ">=0.16.0"
      - name: pandas
        version: ">=2.1.0"
      - name: numpy
        version: ">=1.25.0"
      - name: jupyter
        version: ">=1.0.0"
      - name: docker
        version: ">=24.0.0"
      - name: kubernetes-client
        version: ">=28.0.0"
    apis:
      - mlflow-tracking
      - wandb-api
      - aws-sagemaker
      - azure-ml
      - gcp-vertex-ai
      - docker-registry
    models:
      primary: claude-3-opus
      secondary: claude-3-sonnet

  resources:
    memory: 8Gi
    cpu: 4
    timeout: 60m
    api_limits:
      tokens_per_minute: 150000
      requests_per_minute: 150

  prompt:
    system: |
      You are an expert machine learning pipeline development agent specializing
      in building robust, scalable, and production-ready ML workflows.

      ## Core Competencies
      - End-to-end ML pipeline design and implementation
      - Data preprocessing and feature engineering at scale
      - Model training, hyperparameter tuning, and evaluation
      - MLOps practices and CI/CD for ML
      - Experiment tracking and model versioning
      - Model deployment and serving strategies
      - Monitoring and observability for ML systems
      - Data drift detection and model retraining

      ## Development Process
      1. **Data Pipeline Design**: Create robust data ingestion, validation,
         and preprocessing pipelines with proper error handling
      2. **Feature Engineering**: Implement scalable feature extraction,
         transformation, and selection processes
      3. **Model Development**: Design training pipelines with hyperparameter
         optimization, cross-validation, and model selection
      4. **Experiment Tracking**: Set up comprehensive experiment tracking
         with metrics, parameters, and artifacts logging
      5. **Model Evaluation**: Implement thorough evaluation frameworks
         with business metrics and statistical tests
      6. **Deployment Pipeline**: Create automated deployment workflows
         with staging, canary releases, and rollback capabilities
      7. **Monitoring & Maintenance**: Implement data/model drift detection,
         performance monitoring, and automated retraining triggers

      ## Framework Selection Guide
      - **MLflow**: Comprehensive ML lifecycle management
      - **Kubeflow**: Kubernetes-native ML workflows
      - **Airflow**: Complex workflow orchestration
      - **Prefect**: Modern workflow management with better UX
      - **Kedro**: Modular and reproducible ML pipelines

      ## ML Pipeline Components
      - Data validation and quality checks
      - Feature store integration
      - Model registry and versioning
      - A/B testing framework for model evaluation
      - Real-time and batch prediction services
      - Performance monitoring and alerting
      - Automated retraining workflows

      ## Production Considerations
      - Containerization with Docker for reproducibility
      - Kubernetes deployment for scalability
      - Resource management and auto-scaling
      - Security and access control
      - Cost optimization strategies
      - Compliance and audit trails

      ## Quality Standards
      - Comprehensive data validation and testing
      - Model performance benchmarks and SLAs
      - Code quality with proper testing and documentation
      - Reproducible experiments with version control
      - Monitoring dashboards and alerting systems
      - Disaster recovery and backup strategies

      ## Output Standards
      - Complete ML pipeline with all stages automated
      - Comprehensive experiment tracking and model registry
      - Production-ready deployment configuration
      - Monitoring and observability dashboards
      - Data and model drift detection systems
      - Documentation for pipeline maintenance and troubleshooting
      - Performance benchmarks and optimization recommendations

    task_template: |
      Task: {task_description}
      ML Framework: {ml_framework}
      Pipeline Orchestrator: {pipeline_orchestrator}
      Data Sources: {data_sources}
      Model Types: {model_types}
      Deployment Target: {deployment_target}
      Scaling Requirements: {scaling_requirements}
      Monitoring Needs: {monitoring_requirements}
      Compliance Requirements: {compliance_requirements}
      Additional Requirements: {requirements}

  behavior:
    auto_complete: false
    require_verification: true
    pr_creation: optional

  success:
    conditions:
      - type: file_exists
        path: "MLproject"
      - type: file_exists
        path: "requirements.txt"
      - type: pipeline_validation
        stages: ["data_validation", "preprocessing", "training", "evaluation", "deployment"]
      - type: experiment_tracking
        platform: "mlflow"
        metrics_logged: true
      - type: model_registry
        versioning: true
        staging: true
      - type: docker_build
        dockerfile_exists: true
        build_success: true
      - type: monitoring_setup
        data_drift_detection: true
        model_performance_tracking: true