agent: kubernetes-deployer
category: devops
description: >-
  Verifies valid k8s manifests, monitoring config, runbooks, and security policies;
  manifests must pass a client-side validation.
template: templates/devops/kubernetes-deployer.yaml

scenarios:
  - id: deploy-service
    description: Produce production-ready manifests for a stateless service.
    inputs:
      task_description: Create Kubernetes deployment manifests for the web service.
      requirements: probes, resource limits, HPA, network policy
    pass_threshold: 0.7
    checks:
      - id: report
        type: file_exists
        weight: 1
        critical: true
        path: deployment-report.md
      - id: manifests
        type: file_glob
        weight: 2
        critical: true
        pattern: "k8s-manifests/*.yaml"
        min_matches: 1
      - id: manifests-valid-yaml
        type: command_success
        weight: 2
        description: Manifests parse as YAML.
        command: "python3 -c \"import glob,yaml,sys; [list(yaml.safe_load_all(open(f))) for f in glob.glob('k8s-manifests/*.yaml')] or sys.exit(1)\""
      - id: probes-and-limits
        type: command_output_matches
        weight: 2
        description: Health probes and resource limits are set somewhere in the manifests.
        command: "cat k8s-manifests/*.yaml"
        pattern: "(?i)(livenessProbe|readinessProbe|limits:)"
      - id: monitoring
        type: file_glob
        weight: 1
        pattern: "monitoring-configs/*.yaml"
        min_matches: 1
      - id: runbooks
        type: file_glob
        weight: 1
        pattern: "runbooks/*.md"
        min_matches: 1
      - id: quality
        type: llm_rubric
        weight: 1
        criteria: Are requests/limits sane, probes meaningful, and is least-privilege applied?
