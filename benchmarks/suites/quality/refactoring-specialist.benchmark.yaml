agent: refactoring-specialist
category: quality
description: >-
  Verifies a behavior-preserving refactor: a report, and a verification record
  asserting both behavior_preserved and suite_passed are true.
template: templates/quality/refactoring-specialist.yaml

scenarios:
  - id: extract-and-dedup
    description: Refactor a tangled module without changing behavior.
    inputs:
      task_description: Refactor the orders module to remove duplication.
      target_area: orders
      refactoring_goals: reduce duplication, clarify naming, narrow interfaces
      test_command: "pytest -q"
    pass_threshold: 0.8
    checks:
      - id: report
        type: file_exists
        weight: 2
        critical: true
        path: refactoring-report.md
      - id: verification-file
        type: file_exists
        weight: 1
        critical: true
        path: refactor-verification.json
      - id: behavior-preserved
        type: command_success
        weight: 3
        critical: true
        description: Behavior is preserved and the suite still passes.
        command: "jq -e '.behavior_preserved == true and .suite_passed == true' refactor-verification.json"
      - id: changes-described
        type: file_contains
        weight: 2
        description: Report enumerates the refactorings and rationale.
        path: refactoring-report.md
        pattern: "(?i)(extract|rename|dedup|inline|move|before|after)"
      - id: quality
        type: llm_rubric
        weight: 1
        criteria: Did internal quality genuinely improve while public APIs/outputs stayed identical?
