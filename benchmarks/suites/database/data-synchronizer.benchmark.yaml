agent: data-synchronizer
category: database
description: >-
  Verifies a cross-database sync produces configs, logs, lineage, and performance
  metrics, and documents conflict-resolution strategy.
template: templates/database/data-synchronizer.yaml

scenarios:
  - id: postgres-to-warehouse
    description: Configure a sync from an OLTP database to an analytics warehouse.
    inputs:
      task_description: Set up data synchronization between the app DB and the warehouse.
      requirements: incremental sync, conflict resolution, lineage, metrics
    pass_threshold: 0.7
    checks:
      - id: report
        type: file_exists
        weight: 2
        critical: true
        path: data-sync-report.md
      - id: configs
        type: dir_exists
        weight: 1
        critical: true
        path: sync-configurations/
      - id: logs
        type: file_glob
        weight: 1
        pattern: "sync-logs/*.log"
        min_matches: 1
      - id: lineage
        type: dir_exists
        weight: 1
        path: data-lineage/
      - id: metrics
        type: file_glob
        weight: 2
        description: Performance metrics captured.
        pattern: "performance-metrics/*.json"
        min_matches: 1
      - id: conflict-strategy
        type: file_contains
        weight: 2
        description: Conflict resolution + consistency strategy documented.
        path: data-sync-report.md
        pattern: "(?i)(conflict|idempoten|incremental|cdc|consisten|last.write)"
      - id: quality
        type: llm_rubric
        weight: 1
        criteria: Does the sync handle deletes, schema drift, and partial failures correctly?
