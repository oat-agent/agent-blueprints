agent: release-manager
category: automation
description: >-
  Verifies release automation ships pipelines, gitops, configs, scripts, and —
  critically — both a deployment and a rollback runbook.
template: templates/automation/release-manager.yaml

scenarios:
  - id: progressive-release
    description: Automate a progressive (canary) release with rollback.
    inputs:
      task_description: Set up automated progressive delivery for the service.
      requirements: canary, automated rollback, change log
    pass_threshold: 0.7
    checks:
      - id: pipelines
        type: dir_exists
        weight: 1
        critical: true
        path: pipelines/
      - id: gitops
        type: dir_exists
        weight: 1
        path: gitops/
      - id: scripts
        type: file_glob
        weight: 1
        pattern: "scripts/**/*.sh"
        min_matches: 1
      - id: deployment-doc
        type: file_exists
        weight: 2
        path: docs/DEPLOYMENT.md
      - id: rollback-doc
        type: file_exists
        weight: 3
        critical: true
        description: A rollback runbook is mandatory — releases must be reversible.
        path: docs/ROLLBACK.md
      - id: progressive-strategy
        type: file_contains
        weight: 1
        description: Documents a progressive/canary/blue-green strategy.
        path: docs/DEPLOYMENT.md
        pattern: "(?i)(canary|blue.green|progressive|rolling|feature flag)"
      - id: quality
        type: llm_rubric
        weight: 1
        criteria: Is the rollback automatic on failed health checks, and are release gates well-defined?
