agent: load-tester
category: performance
description: >-
  Verifies a load test produces a report, machine-readable results, charts, and
  reports latency percentiles + throughput against a target.
template: templates/performance/load-tester.yaml

scenarios:
  - id: api-load
    description: Run a load test against an API and report percentiles.
    inputs:
      task_description: Load test the checkout API and report results.
      requirements: ramp profile, p95/p99 latency, throughput, error rate
    pass_threshold: 0.7
    checks:
      - id: report
        type: file_exists
        weight: 2
        critical: true
        path: load-test-report.md
      - id: results-json
        type: file_glob
        weight: 2
        critical: true
        pattern: "load-test-results/*.json"
        min_matches: 1
      - id: charts
        type: file_glob
        weight: 1
        pattern: "load-test-results/*.png"
        min_matches: 1
      - id: percentiles
        type: file_contains
        weight: 2
        description: Reports latency percentiles + throughput.
        path: load-test-report.md
        pattern: "(?i)(p9[59]|percentile|rps|throughput|latency)"
      - id: error-rate
        type: file_contains
        weight: 1
        description: Reports error rate / SLO outcome.
        path: load-test-report.md
        pattern: "(?i)(error rate|errors|slo|threshold)"
      - id: quality
        type: llm_rubric
        weight: 1
        criteria: Is the load model realistic and are conclusions (pass/fail vs SLO) justified by the data?
