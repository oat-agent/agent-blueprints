agent: network-optimizer
category: infrastructure
description: >-
  Verifies a network assessment, optimized configs, performance reports, security
  policies, and monitoring setup.
template: templates/infrastructure/network-optimizer.yaml

scenarios:
  - id: latency-and-security
    description: Optimize network topology for latency and harden segmentation.
    inputs:
      task_description: Optimize and secure the network configuration.
      requirements: lower latency, segmentation, monitoring
    pass_threshold: 0.7
    checks:
      - id: assessment
        type: file_exists
        weight: 2
        critical: true
        path: network-analysis/network-assessment.md
      - id: optimized-configs
        type: command_output_matches
        weight: 2
        critical: true
        description: Optimized network configs present.
        command: "find optimized-configs -type f"
        pattern: "\\.(tf|ya?ml|conf)$"
      - id: performance-reports
        type: command_output_matches
        weight: 1
        command: "find performance-reports -type f"
        pattern: "\\.(md|json)$"
      - id: security-policies
        type: dir_exists
        weight: 2
        path: security-policies/
      - id: monitoring
        type: dir_exists
        weight: 1
        path: monitoring-setup/
      - id: quality
        type: llm_rubric
        weight: 1
        criteria: Are the optimizations correct (routing, MTU, CDN/peering) and is segmentation least-privilege?
