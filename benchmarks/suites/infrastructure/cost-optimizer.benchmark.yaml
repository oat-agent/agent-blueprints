agent: cost-optimizer
category: infrastructure
description: >-
  Verifies a FinOps deliverable: spending analysis, ROI analysis, prioritized
  recommendations, automated policies, and forecasting.
template: templates/infrastructure/cost-optimizer.yaml

scenarios:
  - id: reduce-spend
    description: Analyze spend and produce prioritized, automatable savings.
    inputs:
      task_description: Reduce cloud spend without harming reliability.
      requirements: rightsizing, commitment plans, ROI, guardrails
    pass_threshold: 0.7
    checks:
      - id: spending-analysis
        type: file_exists
        weight: 2
        critical: true
        path: cost-analysis/spending-analysis.md
      - id: roi-analysis
        type: file_exists
        weight: 2
        critical: true
        path: cost-analysis/roi-analysis.md
      - id: recommendations
        type: file_glob
        weight: 2
        pattern: "optimization-recommendations/*.md"
        min_matches: 1
      - id: automated-policies
        type: dir_exists
        weight: 1
        path: automated-policies/
      - id: forecasting
        type: dir_exists
        weight: 1
        path: forecasting-models/
      - id: savings-quantified
        type: file_contains
        weight: 1
        description: Savings are quantified with numbers.
        path: cost-analysis/spending-analysis.md
        pattern: "(?i)(\\$|%|savings|reduce|/mo|per month)"
      - id: quality
        type: llm_rubric
        weight: 1
        criteria: Are savings realistic, prioritized by effort/impact, and safe for reliability/performance?
