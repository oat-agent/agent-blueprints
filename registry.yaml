# Agent Blueprints Registry
#
# This manifest is consumed by the OAT factory's TemplateRegistry.FetchFromRegistry().
# The factory reads this file from `<registry_url>/registry.yaml`, then loads each
# template at `<registry_url>/<path>`.
#
# Schema (RegistryManifest in open-agent-teams-8/internal/factory/registry.go):
#   version:   string
#   templates: list of { name, path, author, verified }
#
# `stability` is an advisory field (not parsed by the factory today) used by tooling
# in this repo to surface readiness. Allowed values: stable | beta | experimental.

version: 1.0.0

